<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社労士試験対策｜労働基準法 過去問一問一答 200問</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Noto Sans JP & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans JP"', 'Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* カスタムスクロールバーと微調整 */
        body {
            background-color: #f8fafc;
            color: #1e293b;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation; /* iPhone Safariでのダブルタップズーム防止 */
        }
        button, select {
            touch-action: manipulation;
        }
        .fade-in {
            animation: fadeIn 0.25s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes popBounce {
            0% { transform: scale(0.95); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
        .pop-bounce {
            animation: popBounce 0.22s ease-out forwards;
        }
        .btn-press:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- ヘッダー -->
    <header class="bg-brand-900 text-white shadow-md sticky top-0 z-30">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-2.5">
                <div class="bg-brand-600 p-2 rounded-lg">
                    <i class="fa-solid fa-scale-balanced text-lg"></i>
                </div>
                <div>
                    <h1 class="text-base sm:text-lg font-bold tracking-tight leading-tight">社労士試験 過去問演習</h1>
                    <p class="text-xs text-brand-100">労働基準法（過去10年分傾向・全200問）</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="toggleListModal()" class="bg-brand-800 hover:bg-brand-700 text-xs sm:text-sm px-3 py-2 rounded-lg font-medium transition flex items-center space-x-1.5 border border-brand-700">
                    <i class="fa-solid fa-list-ol"></i>
                    <span>問題一覧</span>
                </button>
                <button onclick="confirmReset()" class="bg-slate-700 hover:bg-slate-600 text-xs sm:text-sm px-3 py-2 rounded-lg font-medium transition flex items-center space-x-1" title="学習履歴をリセット">
                    <i class="fa-solid fa-rotate-left"></i>
                    <span class="hidden sm:inline">リセット</span>
                </button>
            </div>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="flex-grow max-w-4xl w-full mx-auto px-4 py-5 space-y-5">

        <!-- 進捗・フィルターダッシュボード -->
        <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 sm:p-5">
            <!-- ステータスバー -->
            <div class="grid grid-cols-3 gap-2 sm:gap-4 mb-4 text-center">
                <div class="bg-slate-50 rounded-xl p-2.5 border border-slate-100">
                    <div class="text-xs text-slate-500 font-medium">演習進捗</div>
                    <div class="text-lg sm:text-xl font-bold text-slate-800 mt-0.5">
                        <span id="stat-answered">0</span><span class="text-xs font-normal text-slate-500"> / 200問</span>
                    </div>
                </div>
                <div class="bg-emerald-50 rounded-xl p-2.5 border border-emerald-100">
                    <div class="text-xs text-emerald-700 font-medium">正解数</div>
                    <div class="text-lg sm:text-xl font-bold text-emerald-600 mt-0.5">
                        <span id="stat-correct">0</span><span class="text-xs font-normal text-emerald-600"> 問</span>
                    </div>
                </div>
                <div class="bg-brand-50 rounded-xl p-2.5 border border-brand-100">
                    <div class="text-xs text-brand-700 font-medium">正答率</div>
                    <div class="text-lg sm:text-xl font-bold text-brand-600 mt-0.5">
                        <span id="stat-rate">0</span><span class="text-xs font-normal text-brand-600"> %</span>
                    </div>
                </div>
            </div>

            <!-- プログレスバー -->
            <div class="w-full bg-slate-100 rounded-full h-2 mb-4 overflow-hidden">
                <div id="progress-bar" class="bg-brand-600 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>

            <!-- 絞り込みフィルター -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                <div>
                    <label for="filter-category" class="block text-xs font-semibold text-slate-500 mb-1">分野で絞り込み</label>
                    <select id="filter-category" onchange="applyFilters()" class="w-full bg-slate-50 border border-slate-300 text-slate-800 text-sm rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand-500">
                        <option value="all">すべての分野（200問）</option>
                        <option value="総則・基本原則">1. 総則・基本原則（25問）</option>
                        <option value="労働契約・解雇">2. 労働契約・解雇（30問）</option>
                        <option value="賃金・割増賃金">3. 賃金・割増賃金（30問）</option>
                        <option value="労働時間・休憩・休日">4. 労働時間・休憩・休日（35問）</option>
                        <option value="変形労働・フレックス・みなし">5. 変形労働・みなし労働（25問）</option>
                        <option value="年次有給休暇">6. 年次有給休暇（20問）</option>
                        <option value="年少者・妊産婦等">7. 年少者・妊産婦等（15問）</option>
                        <option value="就業規則・制裁・監督等">8. 就業規則・制裁・監督等（20問）</option>
                    </select>
                </div>
                <div>
                    <label for="filter-year" class="block text-xs font-semibold text-slate-500 mb-1">出題年度（過去10年）</label>
                    <select id="filter-year" onchange="applyFilters()" class="w-full bg-slate-50 border border-slate-300 text-slate-800 text-sm rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand-500">
                        <option value="all">全年度（H28〜R7）</option>
                        <option value="令和7年">令和7年度（2025）</option>
                        <option value="令和6年">令和6年度（2024）</option>
                        <option value="令和5年">令和5年度（2023）</option>
                        <option value="令和4年">令和4年度（2022）</option>
                        <option value="令和3年">令和3年度（2021）</option>
                        <option value="令和2年">令和2年度（2020）</option>
                        <option value="令和元年">令和元年度（2019）</option>
                        <option value="平成30年">平成30年度（2018）</option>
                        <option value="平成29年">平成29年度（2017）</option>
                        <option value="平成28年">平成28年度（2016）</option>
                    </select>
                </div>
                <div>
                    <label for="filter-status" class="block text-xs font-semibold text-slate-500 mb-1">学習状況</label>
                    <select id="filter-status" onchange="applyFilters()" class="w-full bg-slate-50 border border-slate-300 text-slate-800 text-sm rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand-500">
                        <option value="all">すべて表示</option>
                        <option value="unanswered">未解答のみ</option>
                        <option value="incorrect">不正解のみ（弱点克服）</option>
                        <option value="bookmarked">要復習チェックのみ</option>
                    </select>
                </div>
            </div>
        </section>

        <!-- 問題カード -->
        <section id="question-container" class="bg-white rounded-2xl shadow-md border border-slate-200 overflow-hidden">
            <!-- カード上部メタ情報 -->
            <div class="bg-slate-50 px-5 py-3.5 border-b border-slate-200 flex flex-wrap items-center justify-between gap-2">
                <div class="flex items-center space-x-2">
                    <span id="q-number-badge" class="bg-brand-600 text-white text-xs font-bold px-2.5 py-1 rounded-lg">第 1 問</span>
                    <span id="q-category-badge" class="bg-slate-200 text-slate-700 text-xs font-semibold px-2.5 py-1 rounded-lg">総則・基本原則</span>
                    <span id="q-year-badge" class="bg-amber-100 text-amber-800 text-xs font-semibold px-2.5 py-1 rounded-lg">令和7年出題</span>
                </div>
                <div class="flex items-center space-x-3">
                    <span id="q-filtered-pos" class="text-xs text-slate-500 font-medium">1 / 200</span>
                    <button id="bookmark-btn" onclick="toggleBookmark()" class="text-slate-400 hover:text-amber-500 transition p-1" title="要復習マークをつける">
                        <i class="fa-regular fa-star text-lg"></i>
                    </button>
                </div>
            </div>

            <!-- 問題文エリア -->
            <div class="p-5 sm:p-7">
                <div class="mb-2 flex items-center space-x-2">
                    <span id="q-history-badge" class="hidden text-xs font-semibold px-2 py-0.5 rounded"></span>
                </div>
                <p id="q-text" class="text-base sm:text-lg leading-relaxed font-medium text-slate-800 whitespace-pre-line">
                    問題を読み込み中...
                </p>

                <!-- ○×選択エリア -->
                <div class="mt-7">
                    <p class="text-xs font-semibold text-slate-500 text-center mb-3">「○」または「×」をタップして回答してください</p>
                    <div class="grid grid-cols-2 gap-4 max-w-md mx-auto">
                        <button id="btn-choice-true" onclick="selectChoice(true)" class="btn-press flex flex-col items-center justify-center py-4 px-4 rounded-2xl border-2 border-slate-200 bg-white hover:border-brand-400 hover:bg-brand-50/40 transition shadow-sm">
                            <span class="text-3xl sm:text-4xl font-bold text-rose-600 leading-none">○</span>
                            <span class="text-xs font-bold text-slate-600 mt-1.5">正しい</span>
                        </button>
                        <button id="btn-choice-false" onclick="selectChoice(false)" class="btn-press flex flex-col items-center justify-center py-4 px-4 rounded-2xl border-2 border-slate-200 bg-white hover:border-brand-400 hover:bg-brand-50/40 transition shadow-sm">
                            <span class="text-3xl sm:text-4xl font-bold text-blue-600 leading-none">×</span>
                            <span class="text-xs font-bold text-slate-600 mt-1.5">誤り</span>
                        </button>
                    </div>

                    <!-- ○×押下時の即時正誤リアクションバナー -->
                    <div id="instant-feedback" class="hidden max-w-md mx-auto mt-4 rounded-xl p-3.5 flex items-center justify-between shadow-xs pop-bounce">
                        <div class="flex items-center space-x-3">
                            <div id="instant-icon" class="w-9 h-9 rounded-full flex items-center justify-center text-white text-lg shrink-0"></div>
                            <div>
                                <div id="instant-title" class="font-bold text-base leading-tight"></div>
                                <div id="instant-subtitle" class="text-xs opacity-90 mt-0.5"></div>
                            </div>
                        </div>
                        <div class="text-right pl-2">
                            <span class="text-[11px] block opacity-75">正解</span>
                            <span id="instant-correct-symbol" class="text-2xl font-extrabold leading-none"></span>
                        </div>
                    </div>
                </div>

                <!-- 解答確認ボタン -->
                <div class="mt-5 max-w-md mx-auto">
                    <button id="btn-check-answer" onclick="checkAnswer()" class="btn-press w-full py-3.5 px-6 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-bold text-base shadow-md hover:shadow-lg transition flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-book-open"></i>
                        <span>解答・解説を確認する</span>
                    </button>
                </div>

                <!-- 解答・解説エリア（初期非表示） -->
                <div id="answer-panel" class="hidden mt-6 pt-5 border-t-2 border-dashed border-slate-200 fade-in">
                    <!-- 正誤判定バナー -->
                    <div id="result-banner" class="rounded-xl p-4 mb-4 flex items-center justify-between">
                        <div class="flex items-center space-x-3">
                            <div id="result-icon" class="w-10 h-10 rounded-full flex items-center justify-center text-white text-xl font-bold"></div>
                            <div>
                                <div id="result-title" class="font-bold text-lg"></div>
                                <div id="result-subtitle" class="text-xs opacity-90"></div>
                            </div>
                        </div>
                        <div class="text-right">
                            <span class="text-xs block opacity-75">正解</span>
                            <span id="correct-answer-symbol" class="text-2xl font-extrabold"></span>
                        </div>
                    </div>

                    <!-- 条文・解説ボックス -->
                    <div class="bg-slate-50 rounded-xl p-4 sm:p-5 border border-slate-200 space-y-2.5">
                        <div class="flex items-center justify-between flex-wrap gap-2">
                            <span class="text-xs font-bold text-brand-700 bg-brand-100 px-2.5 py-1 rounded-md">
                                <i class="fa-solid fa-book-open mr-1"></i>解説・根拠条文
                            </span>
                            <span id="q-law-ref" class="text-xs font-semibold text-slate-500"></span>
                        </div>
                        <p id="q-explanation" class="text-sm sm:text-base leading-relaxed text-slate-700"></p>
                    </div>
                </div>
            </div>

            <!-- フッターナビゲーション -->
            <div class="bg-slate-50 px-5 py-3.5 border-t border-slate-200 flex items-center justify-between">
                <button id="btn-prev" onclick="prevQuestion()" class="btn-press px-4 py-2.5 rounded-xl bg-white border border-slate-300 hover:bg-slate-100 text-slate-700 font-semibold text-sm transition flex items-center space-x-1.5 disabled:opacity-40 disabled:pointer-events-none">
                    <i class="fa-solid fa-chevron-left"></i>
                    <span>前の問題</span>
                </button>

                <button onclick="randomQuestion()" class="btn-press px-3.5 py-2.5 rounded-xl bg-white border border-slate-300 hover:bg-slate-100 text-slate-600 font-medium text-xs sm:text-sm transition flex items-center space-x-1.5" title="現在の絞り込み条件からランダム出題">
                    <i class="fa-solid fa-shuffle"></i>
                    <span>ランダム</span>
                </button>

                <button id="btn-next" onclick="nextQuestion()" class="btn-press px-4 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-semibold text-sm transition flex items-center space-x-1.5 disabled:opacity-40 disabled:pointer-events-none">
                    <span>次の問題</span>
                    <i class="fa-solid fa-chevron-right"></i>
                </button>
            </div>
        </section>

        <!-- 絞り込み結果が0件の場合の表示 -->
        <section id="empty-state" class="hidden bg-white rounded-2xl shadow-sm border border-slate-200 p-10 text-center space-y-4">
            <div class="w-16 h-16 bg-slate-100 text-slate-400 rounded-full flex items-center justify-center mx-auto text-2xl">
                <i class="fa-solid fa-filter-circle-xmark"></i>
            </div>
            <h2 class="text-lg font-bold text-slate-800">条件に一致する問題がありません</h2>
            <p class="text-sm text-slate-500">フィルター条件を変更して再度お試しください。</p>
            <button onclick="resetFilters()" class="px-5 py-2.5 bg-brand-600 hover:bg-brand-700 text-white text-sm font-semibold rounded-xl transition">
                フィルターを解除する
            </button>
        </section>

    </main>

    <!-- フッター -->
    <footer class="max-w-4xl mx-auto px-4 py-6 text-center text-xs text-slate-400">
        <p>社会保険労務士試験対策 労働基準法 過去10年分（平成28年〜令和7年）出題論点網羅 200問</p>
        <p class="mt-1">※学習進捗はブラウザに自動保存されます。</p>
    </footer>

    <!-- 問題一覧モーダル -->
    <div id="list-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl max-w-3xl w-full max-h-[85vh] flex flex-col overflow-hidden">
            <div class="px-5 py-4 border-b border-slate-200 flex items-center justify-between bg-slate-50">
                <div>
                    <h3 class="font-bold text-slate-800 text-base">全200問 一覧ジャンプ</h3>
                    <p class="text-xs text-slate-500 mt-0.5">
                        <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-500 mr-1"></span>正解
                        <span class="inline-block w-2.5 h-2.5 rounded-full bg-rose-500 ml-2 mr-1"></span>不正解
                        <span class="inline-block w-2.5 h-2.5 rounded-full bg-slate-200 ml-2 mr-1"></span>未解答
                    </p>
                </div>
                <button onclick="toggleListModal()" class="w-8 h-8 rounded-lg hover:bg-slate-200 flex items-center justify-center text-slate-500">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div id="question-grid" class="p-5 overflow-y-auto grid grid-cols-5 sm:grid-cols-10 gap-2">
                <!-- JSで200問のボタンを生成 -->
            </div>
        </div>
    </div>

    <!-- カスタム確認ダイアログ（alert/confirm代替） -->
    <div id="custom-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl max-w-sm w-full p-6 text-center space-y-4">
            <div id="modal-icon-box" class="w-12 h-12 rounded-full bg-amber-100 text-amber-600 flex items-center justify-center mx-auto text-xl">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h3 id="modal-title" class="font-bold text-slate-800 text-lg">確認</h3>
            <p id="modal-message" class="text-sm text-slate-600 leading-relaxed"></p>
            <div id="modal-actions" class="flex space-x-3 pt-2">
                <button id="modal-cancel-btn" onclick="closeCustomModal()" class="flex-1 py-2.5 rounded-xl border border-slate-300 text-slate-700 font-semibold text-sm hover:bg-slate-50">
                    キャンセル
                </button>
                <button id="modal-confirm-btn" class="flex-1 py-2.5 rounded-xl bg-rose-600 text-white font-semibold text-sm hover:bg-rose-700">
                    実行する
                </button>
            </div>
        </div>
    </div>

    <!-- 通知トースト -->
    <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-xs sm:text-sm font-medium px-4 py-2.5 rounded-full shadow-lg opacity-0 pointer-events-none transition-opacity duration-200 z-50">
        メッセージ
    </div>

    <script>
        /**
         * 社労士試験 労働基準法 過去10年（平成28年〜令和7年）出題論点 全200問データベース
         * 各問題オブジェクト:
         * id: 1〜200
         * category: 分野名
         * year: 出題年度
         * text: 問題文
         * answer: true(○) または false(×)
         * ref: 根拠条文・判例
         * explanation: 詳しい解説
         */
        const QUESTIONS_DB = [
            // =========================================================================
            // 1. 総則・基本原則（第1問〜第25問）
            // =========================================================================
            {
                id: 1,
                category: "総則・基本原則",
                year: "令和7年",
                text: "労働基準法第1条にいう「労働条件」には、賃金、労働時間、解雇、災害補償等の基本的な労働条件のほか、寄宿舎に関する条件も含まれるが、安全衛生に関する条件は労働安全衛生法に委ねられているため含まれない。",
                answer: false,
                ref: "労働基準法第1条、昭22.9.13発基17号",
                explanation: "誤りです。労働基準法第1条の「労働条件」とは、職場における一切の待遇をいい、賃金、労働時間はもちろん、解雇、災害補償、安全衛生、寄宿舎等に関する条件も含まれます。"
            },
            {
                id: 2,
                category: "総則・基本原則",
                year: "令和6年",
                text: "労働基準法第1条第2項は、「この法律で定める労働条件の基準は最低のものであるから、労働関係の当事者は、この基準を理由として労働条件を低下させてはならないことはもとより、その向上を図るように努めなければならない。」と規定しているが、社会経済情勢の変動等他に決定的な理由がある場合に労働条件を低下させることまで禁止するものではない。",
                answer: true,
                ref: "労働基準法第1条第2項、昭22.9.13発基17号",
                explanation: "正しい記述です。同項は「この基準を理由として」労働条件を低下させることを禁止するものであり、社会経済情勢の変動等、他に決定的な理由がある場合に労働条件を引き下げることまで禁止する趣旨ではありません。"
            },
            {
                id: 3,
                category: "総則・基本原則",
                year: "令和5年",

        // =========================================================================
        // アプリケーション状態管理
        // =========================================================================
        const STORAGE_KEY = 'sharoushi_roukihou_200_state_v1';

        let appState = {
            // answers: { [questionId]: { userChoice: boolean, isCorrect: boolean } }
            answers: {},
            // bookmarks: { [questionId]: true }
            bookmarks: {},
            // 現在のフィルター条件
            filters: {
                category: 'all',
                year: 'all',
                status: 'all'
            },
            // 現在表示中の問題ID
            currentQuestionId: 1
        };

        let filteredQuestions = [...QUESTIONS_DB];
        let tempUserChoice = null; // 解答ボタンを押す前の選択状態（true / false / null）

        // =========================================================================
        // 初期化とローカルストレージ管理
        // =========================================================================
        function initApp() {
            loadState();
            // フィルターUIを復元
            document.getElementById('filter-category').value = appState.filters.category;
            document.getElementById('filter-year').value = appState.filters.year;
            document.getElementById('filter-status').value = appState.filters.status;

            applyFilters(false);
            updateStats();
            renderQuestionGrid();
        }

        function loadState() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    appState = {
                        ...appState,
                        ...parsed,
                        filters: { ...appState.filters, ...(parsed.filters || {}) }
                    };
                }
            } catch (e) {
                console.error('Failed to load state:', e);
            }
        }

        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
            } catch (e) {
                console.error('Failed to save state:', e);
            }
        }

        // =========================================================================
        // フィルタリング処理
        // =========================================================================
        function applyFilters(resetIndex = true) {
            const cat = document.getElementById('filter-category').value;
            const yr = document.getElementById('filter-year').value;
            const st = document.getElementById('filter-status').value;

            appState.filters = { category: cat, year: yr, status: st };
            saveState();

            filteredQuestions = QUESTIONS_DB.filter(q => {
                if (cat !== 'all' && q.category !== cat) return false;
                if (yr !== 'all' && q.year !== yr) return false;

                const ans = appState.answers[q.id];
                const isBookmarked = !!appState.bookmarks[q.id];

                if (st === 'unanswered' && ans !== undefined) return false;
                if (st === 'incorrect' && (!ans || ans.isCorrect)) return false;
                if (st === 'bookmarked' && !isBookmarked) return false;

                return true;
            });

            if (filteredQuestions.length === 0) {
                document.getElementById('question-container').classList.add('hidden');
                document.getElementById('empty-state').classList.remove('hidden');
                return;
            }

            document.getElementById('question-container').classList.remove('hidden');
            document.getElementById('empty-state').classList.add('hidden');

            if (resetIndex || !filteredQuestions.some(q => q.id === appState.currentQuestionId)) {
                appState.currentQuestionId = filteredQuestions[0].id;
            }

            renderCurrentQuestion();
        }

        function resetFilters() {
            document.getElementById('filter-category').value = 'all';
            document.getElementById('filter-year').value = 'all';
            document.getElementById('filter-status').value = 'all';
            applyFilters(true);
        }

        // =========================================================================
        // 問題表示と操作ロジック
        // =========================================================================
        function renderCurrentQuestion() {
            const currentIndex = filteredQuestions.findIndex(q => q.id === appState.currentQuestionId);
            const question = filteredQuestions[currentIndex] || filteredQuestions[0];
            appState.currentQuestionId = question.id;
            saveState();

            // メタ情報更新
            document.getElementById('q-number-badge').textContent = `第 ${question.id} 問`;
            document.getElementById('q-category-badge').textContent = question.category;
            document.getElementById('q-year-badge').textContent = `${question.year}出題`;
            document.getElementById('q-filtered-pos').textContent = `${currentIndex + 1} / ${filteredQuestions.length}`;
            document.getElementById('q-text').textContent = question.text;

            // ブックマーク状態更新
            updateBookmarkIcon(question.id);

            // 過去の解答履歴バッジ
            const historyBadge = document.getElementById('q-history-badge');
            const prevAns = appState.answers[question.id];
            if (prevAns) {
                historyBadge.classList.remove('hidden', 'bg-emerald-100', 'text-emerald-700', 'bg-rose-100', 'text-rose-700');
                if (prevAns.isCorrect) {
                    historyBadge.classList.add('bg-emerald-100', 'text-emerald-700');
                    historyBadge.innerHTML = '<i class="fa-solid fa-circle-check mr-1"></i>前回：正解';
                } else {
                    historyBadge.classList.add('bg-rose-100', 'text-rose-700');
                    historyBadge.innerHTML = '<i class="fa-solid fa-circle-xmark mr-1"></i>前回：不正解';
                }
            } else {
                historyBadge.classList.add('hidden');
            }

            // 選択状態と解答パネルのリセット
            tempUserChoice = null;
            resetChoiceButtonsUI();
            document.getElementById('instant-feedback').classList.add('hidden');
            document.getElementById('answer-panel').classList.add('hidden');

            // 前へ・次へボタンの制御
            document.getElementById('btn-prev').disabled = (currentIndex <= 0);
            document.getElementById('btn-next').disabled = (currentIndex >= filteredQuestions.length - 1);
        }

        function resetChoiceButtonsUI() {
            const btnTrue = document.getElementById('btn-choice-true');
            const btnFalse = document.getElementById('btn-choice-false');

            btnTrue.className = "btn-press flex flex-col items-center justify-center py-4 px-4 rounded-2xl border-2 border-slate-200 bg-white hover:border-brand-400 hover:bg-brand-50/40 transition shadow-sm";
            btnFalse.className = "btn-press flex flex-col items-center justify-center py-4 px-4 rounded-2xl border-2 border-slate-200 bg-white hover:border-brand-400 hover:bg-brand-50/40 transition shadow-sm";
        }

        function selectChoice(choice) {
            const question = QUESTIONS_DB.find(q => q.id === appState.currentQuestionId);
            if (!question) return;

            tempUserChoice = choice;
            const isCorrect = (choice === question.answer);

            // 成績を記録して統計・一覧を更新
            appState.answers[question.id] = {
                userChoice: choice,
                isCorrect: isCorrect
            };
            saveState();
            updateStats();
            renderQuestionGrid();

            // ボタンのスタイルを正誤に応じて即時変化
            resetChoiceButtonsUI();
            const targetBtn = choice === true
                ? document.getElementById('btn-choice-true')
                : document.getElementById('btn-choice-false');

            targetBtn.classList.remove('border-slate-200', 'bg-white');
            if (isCorrect) {
                targetBtn.classList.add('border-emerald-500', 'bg-emerald-50', 'ring-2', 'ring-emerald-200');
            } else {
                targetBtn.classList.add('border-rose-500', 'bg-rose-50', 'ring-2', 'ring-rose-200');
            }

            // ○×ボタン直下に即時の正誤リアクションを表示
            const instantBox = document.getElementById('instant-feedback');
            const instantIcon = document.getElementById('instant-icon');
            const instantTitle = document.getElementById('instant-title');
            const instantSubtitle = document.getElementById('instant-subtitle');
            const instantSymbol = document.getElementById('instant-correct-symbol');

            // アニメーション再発火のためクラスを付け直し
            instantBox.classList.remove('hidden', 'pop-bounce', 'bg-emerald-50', 'border-emerald-300', 'text-emerald-900', 'bg-rose-50', 'border-rose-300', 'text-rose-900');
            void instantBox.offsetWidth;
            instantBox.classList.add('border', 'pop-bounce');

            instantSymbol.textContent = question.answer ? '○' : '×';

            if (isCorrect) {
                instantBox.classList.add('bg-emerald-50', 'border-emerald-300', 'text-emerald-900');
                instantIcon.className = "w-9 h-9 rounded-full flex items-center justify-center bg-emerald-600 text-white text-lg shrink-0";
                instantIcon.innerHTML = '<i class="fa-solid fa-check"></i>';
                instantTitle.textContent = "正解！";
                instantSubtitle.textContent = "下のボタンから根拠条文・解説を確認できます";
                instantSymbol.className = "text-2xl font-extrabold leading-none text-emerald-600";
            } else {
                instantBox.classList.add('bg-rose-50', 'border-rose-300', 'text-rose-900');
                instantIcon.className = "w-9 h-9 rounded-full flex items-center justify-center bg-rose-600 text-white text-lg shrink-0";
                instantIcon.innerHTML = '<i class="fa-solid fa-xmark"></i>';
                instantTitle.textContent = "不正解…";
                instantSubtitle.textContent = "下のボタンから根拠条文・解説を確認しましょう";
                instantSymbol.className = "text-2xl font-extrabold leading-none text-rose-600";
            }

            // すでに解説パネルが開いている場合は内容もリアルタイム更新
            if (!document.getElementById('answer-panel').classList.contains('hidden')) {
                checkAnswer();
            }
        }

        function checkAnswer() {
            const question = QUESTIONS_DB.find(q => q.id === appState.currentQuestionId);
            if (!question) return;

            const answerPanel = document.getElementById('answer-panel');
            const resultBanner = document.getElementById('result-banner');
            const resultIcon = document.getElementById('result-icon');
            const resultTitle = document.getElementById('result-title');
            const resultSubtitle = document.getElementById('result-subtitle');
            const correctSymbol = document.getElementById('correct-answer-symbol');

            // 正解シンボル表示
            correctSymbol.textContent = question.answer ? '○' : '×';

            // ユーザーが○か×を選択していた場合は正誤判定＆記録
            if (tempUserChoice !== null) {
                const isCorrect = (tempUserChoice === question.answer);
                appState.answers[question.id] = {
                    userChoice: tempUserChoice,
                    isCorrect: isCorrect
                };
                saveState();
                updateStats();
                renderQuestionGrid();

                resultBanner.className = "rounded-xl p-4 mb-4 flex items-center justify-between";
                if (isCorrect) {
                    resultBanner.classList.add('bg-emerald-50', 'border', 'border-emerald-200', 'text-emerald-900');
                    resultIcon.className = "w-10 h-10 rounded-full flex items-center justify-center bg-emerald-600 text-white text-xl";
                    resultIcon.innerHTML = '<i class="fa-solid fa-check"></i>';
                    resultTitle.textContent = "正解です！";
                    resultSubtitle.textContent = `あなたの回答：${tempUserChoice ? '○（正しい）' : '×（誤り）'}`;
                    correctSymbol.className = "text-3xl font-extrabold text-emerald-600";
                } else {
                    resultBanner.classList.add('bg-rose-50', 'border', 'border-rose-200', 'text-rose-900');
                    resultIcon.className = "w-10 h-10 rounded-full flex items-center justify-center bg-rose-600 text-white text-xl";
                    resultIcon.innerHTML = '<i class="fa-solid fa-xmark"></i>';
                    resultTitle.textContent = "不正解です";
                    resultSubtitle.textContent = `あなたの回答：${tempUserChoice ? '○（正しい）' : '×（誤り）'}`;
                    correctSymbol.className = "text-3xl font-extrabold text-rose-600";
                }
            } else {
                // 未選択のまま「解答を確認する」を押した場合
                resultBanner.className = "rounded-xl p-4 mb-4 flex items-center justify-between bg-slate-100 border border-slate-300 text-slate-800";
                resultIcon.className = "w-10 h-10 rounded-full flex items-center justify-center bg-slate-600 text-white text-lg";
                resultIcon.innerHTML = '<i class="fa-solid fa-lightbulb"></i>';
                resultTitle.textContent = "解答・解説の確認";
                resultSubtitle.textContent = "※○または×を選択すると正誤が記録されます";
                correctSymbol.className = `text-3xl font-extrabold ${question.answer ? 'text-rose-600' : 'text-blue-600'}`;
            }

            // 解説・条文をセット
            document.getElementById('q-law-ref').textContent = question.ref;
            document.getElementById('q-explanation').textContent = question.explanation;

            answerPanel.classList.remove('hidden');

            // スマホ等で解説が見やすい位置へスムーズスクロール
            setTimeout(() => {
                answerPanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 50);
        }

        function prevQuestion() {
            const currentIndex = filteredQuestions.findIndex(q => q.id === appState.currentQuestionId);
            if (currentIndex > 0) {
                appState.currentQuestionId = filteredQuestions[currentIndex - 1].id;
                renderCurrentQuestion();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function nextQuestion() {
            const currentIndex = filteredQuestions.findIndex(q => q.id === appState.currentQuestionId);
            if (currentIndex < filteredQuestions.length - 1) {
                appState.currentQuestionId = filteredQuestions[currentIndex + 1].id;
                renderCurrentQuestion();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function randomQuestion() {
            if (filteredQuestions.length <= 1) return;
            let nextQ;
            do {
                const randIdx = Math.floor(Math.random() * filteredQuestions.length);
                nextQ = filteredQuestions[randIdx];
            } while (nextQ.id === appState.currentQuestionId);

            appState.currentQuestionId = nextQ.id;
            renderCurrentQuestion();
            showToast(`第 ${nextQ.id} 問をランダム出題しました`);
        }

        // =========================================================================
        // ブックマーク（要復習チェック）機能
        // =========================================================================
        function toggleBookmark() {
            const qId = appState.currentQuestionId;
            if (appState.bookmarks[qId]) {
                delete appState.bookmarks[qId];
                showToast('要復習マークを解除しました');
            } else {
                appState.bookmarks[qId] = true;
                showToast('要復習マークをつけました');
            }
            saveState();
            updateBookmarkIcon(qId);
            renderQuestionGrid();
        }

        function updateBookmarkIcon(qId) {
            const btn = document.getElementById('bookmark-btn');
            if (appState.bookmarks[qId]) {
                btn.innerHTML = '<i class="fa-solid fa-star text-lg text-amber-400"></i>';
            } else {
                btn.innerHTML = '<i class="fa-regular fa-star text-lg text-slate-400"></i>';
            }
        }

        // =========================================================================
        // 統計・進捗表示の更新
        // =========================================================================
        function updateStats() {
            const answeredIds = Object.keys(appState.answers);
            const answeredCount = answeredIds.length;
            const correctCount = answeredIds.filter(id => appState.answers[id].isCorrect).length;
            const rate = answeredCount > 0 ? Math.round((correctCount / answeredCount) * 100) : 0;
            const progressPercent = Math.round((answeredCount / QUESTIONS_DB.length) * 100);

            document.getElementById('stat-answered').textContent = answeredCount;
            document.getElementById('stat-correct').textContent = correctCount;
            document.getElementById('stat-rate').textContent = rate;
            document.getElementById('progress-bar').style.width = `${progressPercent}%`;
        }

        // =========================================================================
        // 問題一覧モーダル
        // =========================================================================
        function toggleListModal() {
            const modal = document.getElementById('list-modal');
            modal.classList.toggle('hidden');
            if (!modal.classList.contains('hidden')) {
                renderQuestionGrid();
            }
        }

        function renderQuestionGrid() {
            const grid = document.getElementById('question-grid');
            grid.innerHTML = '';

            QUESTIONS_DB.forEach(q => {
                const btn = document.createElement('button');
                const ans = appState.answers[q.id];
                const isBookmarked = !!appState.bookmarks[q.id];
                const isCurrent = (q.id === appState.currentQuestionId);

                let styleClass = "bg-slate-100 text-slate-700 hover:bg-slate-200 border-slate-200";
                if (ans) {
                    if (ans.isCorrect) {
                        styleClass = "bg-emerald-500 text-white hover:bg-emerald-600 border-emerald-600";
                    } else {
                        styleClass = "bg-rose-500 text-white hover:bg-rose-600 border-rose-600";
                    }
                }
                if (isCurrent) {
                    styleClass += " ring-2 ring-brand-600 ring-offset-1";
                }

                btn.className = `relative py-2 rounded-lg text-xs font-bold border transition ${styleClass}`;
                btn.textContent = q.id;
                if (isBookmarked) {
                    btn.innerHTML += `<span class="absolute -top-1 -right-1 text-[10px] text-amber-400 drop-shadow"><i class="fa-solid fa-star"></i></span>`;
                }

                btn.onclick = () => {
                    // 一覧から直接選んだ場合はフィルターを全表示に戻してジャンプ
                    document.getElementById('filter-category').value = 'all';
                    document.getElementById('filter-year').value = 'all';
                    document.getElementById('filter-status').value = 'all';
                    appState.currentQuestionId = q.id;
                    applyFilters(false);
                    toggleListModal();
                };

                grid.appendChild(btn);
            });
        }

        // =========================================================================
        // リセット確認モーダル＆トースト通知
        // =========================================================================
        function confirmReset() {
            const modal = document.getElementById('custom-modal');
            document.getElementById('modal-title').textContent = '学習履歴のリセット';
            document.getElementById('modal-message').textContent = 'これまでの解答履歴（正解・不正解の記録）および要復習マークをすべて消去しますか？';
            document.getElementById('modal-confirm-btn').onclick = () => {
                appState.answers = {};
                appState.bookmarks = {};
                saveState();
                updateStats();
                applyFilters(false);
                renderQuestionGrid();
                closeCustomModal();
                showToast('学習履歴をリセットしました');
            };
            modal.classList.remove('hidden');
        }

        function closeCustomModal() {
            document.getElementById('custom-modal').classList.add('hidden');
        }

        let toastTimeout;
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.remove('opacity-0');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.add('opacity-0');
            }, 2200);
        }

        // アプリ起動
        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
